<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <!-- Calculator Body -->
  <rect x="6" y="4" width="52" height="56" rx="11" fill="url(#bodyGrad)"/>
  <rect x="6.5" y="4.5" width="51" height="55" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
  <!-- LCD Display Screen -->
  <rect x="12" y="10" width="40" height="15" rx="4" fill="url(#screenGrad)" stroke="#292524" stroke-width="0.75"/>
  <text x="48" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="900" fill="#38bdf8" text-anchor="end">1.00</text>
  <rect x="14" y="13" width="7" height="3" rx="1" fill="#78716c" opacity="0.6"/>
  <!-- Keypad Buttons -->
  <rect x="12" y="29" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="27" y="29" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="42" y="29" width="10" height="7" rx="2" fill="#7c2d12" fill-opacity="0.85"/>
  <rect x="12" y="38" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="27" y="38" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="42" y="38" width="10" height="7" rx="2" fill="#7c2d12" fill-opacity="0.85"/>
  <rect x="12" y="47" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="27" y="47" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="42" y="47" width="10" height="7" rx="2" fill="#38bdf8"/>
</svg>
